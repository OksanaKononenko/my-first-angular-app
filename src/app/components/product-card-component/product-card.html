<p>product-card works!</p>
<div class="product-box">
  <h3>{{ name }}</h3>

  <!-- <img [src]="image" [alt]="name"> -->
   <img [src]="imageUrl" alt="{{ name }}" >

  <p>Ціна: {{ price }} грн</p>
  <p>Кількість: {{ quantity }} шт.</p>
<!-- <button (click)="onBuyClick()">Купити</button> -->
 <button (click)="onBuyClick()" [disabled]="quantity === 0">
    @if (quantity > 0) {
      Купити
    } @else {
      Немає в наявності
    }
  </button>
</div>
